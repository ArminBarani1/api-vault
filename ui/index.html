function md(src){src=String(src).replace(/\r\n?/g,'\n');const cb=[];src=src.replace(/```(\w*)[^\n]*\n?([\s\S]*?)```/g,(m,l,c)=>{cb.push({l,c});return '\n\u0000'+(cb.length-1)+'\u0000\n'});
const st=[],keep=h=>{st.push(h);return '\u0001'+(st.length-1)+'\u0001'};
const inl=s=>{s=esc(s).replace(/`([^`\n]+)`/g,(m,c)=>keep(`<code class="ic2">${c}</code>`))
.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>keep(`<a href="${u}">${a}</a>`))
.replace(/https?:\/\/(?:(?!&(?:quot|#39|lt|gt);)\S)+/g,m=>{const x=m.match(/[.,;:!?)\]،؛؟]+$/),tail=x?x[0]:'',u=tail?m.slice(0,-tail.length):m;return keep(`<a href="${u}">${u}</a>`)+tail})
.replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*]+?)(?<!\s)\*(?!\*)/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>');
for(let k=0;k<3;k++)s=s.replace(/\u0001(\d+)\u0001/g,(m,i)=>st[i]);return s};
const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/,isBlk=l=>/^\u0000\d+\u0000$|^#{1,6}\s|^\s*>|^\s*\|/.test(l)||LI.test(l)||/^\s*([-*_])\1{2,}\s*$/.test(l);
const L=src.split('\n');let o='',i=0,m;
while(i<L.length){const l=L[i];
if(m=l.match(/^\u0000(\d+)\u0000$/)){const b=cb[m[1]];o+=`<div class="cb"><div class="ch"><span>${esc(b.l)||'code'}</span><button data-cp="1" title="${t('copy')}">${ic('copy',14)}</button></div><pre>${esc(b.c.replace(/\n$/,''))}</pre></div>`;i++;continue}
if(m=l.match(/^(#{1,6})\s+(.*)$/)){const n=Math.min(m[1].length+2,6);o+=`<h${n}>${inl(m[2])}</h${n}>`;i++;continue}
if(/^\s*([-*_])\1{2,}\s*$/.test(l)){o+='<hr>';i++;continue}
if(/^\s*>/.test(l)){const q=[];while(i<L.length&&/^\s*>/.test(L[i]))q.push(L[i++].replace(/^\s*>\s?/,''));o+=`<blockquote>${q.map(inl).join('<br>')}</blockquote>`;continue}
if(m=l.match(LI)){const ord=/^\d/.test(m[2]),it=[];let x;while(i<L.length&&(x=L[i].match(LI))){it.push(`<li style="margin-inline-start:${Math.min(Math.floor(x[1].replace(/\t/g,'  ').length/2),4)*16}px">${inl(x[3])}</li>`);i++}const g=ord?'ol':'ul';o+=`<${g}>${it.join('')}</${g}>`;continue}
if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])&&L[i+1].includes('-')){const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());const hd=cells(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(cells(L[i++]));o+=`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
if(!l.trim()){i++;continue}
const p=[L[i++]];while(i<L.length&&L[i].trim()&&!isBlk(L[i]))p.push(L[i++]);o+=`<p>${p.map(inl).join('<br>')}</p>`}
return o}

<section class="sec glass"><h3>${t('sec_look')}</h3><label>${t('theme')}</label>${sg('s_t',[['system',t('system')],['light',t('light')],['dark',t('dark')]],S.theme)}<label>${t('lang')}</label>${sg('s_l',[['fa','فارسی'],['en','English']],S.lang)}</section>
<section class="sec glass"><h3>${t('sec_fx')}</h3><label>${t('fx')}</label>${sg('s_fx',[['full',t('fx_full')],['lite',t('fx_lite')],['off',t('fx_off')]],S.fx)}<div class="hint">${t('fx_hint')}</div><label>${t('chatstyle')}</label>${sg('s_cs',[['solid',t('cs_solid')],['glass',t('cs_glass')]],S.chat)}</section>
<section class="sec glass"><h3>${t('bg')}</h3><div class="row" style="margin-top:0"><button id="bg_c">${ic('img',16)} ${t('choose')}</button><button id="bg_r">${t('reset_bg')}</button></div><input id="bgf" type="file" accept="image/*" hidden><label>${t('dim')}</label><input id="s_d" type="range" min="0" max="70" value="${S.dim}"></section>
<section class="sec glass"><h3>${t('sec_app')}</h3><div class="rw"><span>${t('tray')}</span>${sw('s_tray',S.tray)}</div><div class="rw"><span>${t('clipclear')}</span>${sw('s_cc',S.clipClear)}</div><div class="rw"><span>${t('exp')}</span><button id="s_e">${ic('file',16)} ${t('exp')}</button></div></section>
<section class="sec glass wide"><h3>${t('sec_sec')}</h3><label>${t('lockmode')}</label>${sg('s_lm',[['none',t('nolock')],['pin',t('pin')],['password',t('password')]],lockMode)}<div id="lm_f" class="stack"></div>
<div class="rw"><span>${t('auto')}</span><select id="s_a" style="width:90px">${[0,1,5,15,30].map(v=>`<option ${v==S.lock?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="rw"><span>${t('lockhide')}</span>${sw('s_lh',S.lockHide)}</div>
<div class="rw"><span style="color:var(--no)">${t('danger')}</span><button class="dn" id="s_er">${ic('trash',16)} ${t('erase')}</button></div></section>
<section class="sec glass wide"><h3>${t('about')}</h3><div class="about">${big(76)}<div class="tx"><h4>API Vault</h4><div class="hint">${t('ab_desc')}</div><div class="hint">${t('ab_ver')}: ${APP.ver} · MIT</div>
<div class="dev"><img class="av" src="icon/author.webp" alt="" onerror="avfb(this)"><div><small>${t('ab_dev')}</small><b style="color:var(--strong)">${t('ab_name')}</b></div></div></div>
${hasRepo?`<div class="stack"><button data-url="${APP.repo}">${ic('link',16)} ${t('ab_gh')}</button><button data-url="${APP.repo}/issues">${ic('info',16)} ${t('ab_issue')}</button></div>`:''}</div></section></div></div>`;
document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>openUrl(b.dataset.url));
wireSeg('#s_t',v=>{S.theme=v;look();document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th==v))});wireSeg('#s_l',v=>{S.lang=v;look();main()});
wireSeg('#s_fx',v=>{S.fx=v;look()});wireSeg('#s_cs',v=>{S.chat=v;look()});
let tm=lockMode;wireSeg('#s_lm',v=>{tm=v;lmForm(tm)});lmForm(tm);
$('#s_a').onchange=e=>{S.lock=+e.target.value;look();bump()};$('#s_d').oninput=e=>{S.dim=+e.target.value;look()};
$('#s_lh').onclick=e=>{S.lockHide=!S.lockHide;e.currentTarget.classList.toggle('on',S.lockHide);look()};
$('#s_cc').onclick=e=>{S.clipClear=!S.clipClear;e.currentTarget.classList.toggle('on',S.clipClear);look()};
$('#s_tray').onclick=e=>{S.tray=!S.tray;e.currentTarget.classList.toggle('on',S.tray);look();inv('set_tray',{on:S.tray})};$('#s_e').onclick=exportPdf;
$('#s_er').onclick=async()=>{if(confirm(t('resetq'))){await inv('reset_vault');items=[];chats=[];cc=null;boot()}};
$('#bg_c').onclick=()=>$('#bgf').click();$('#bg_r').onclick=()=>{localStorage.removeItem('bg2');look();toast('✓')};
$('#bgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1920/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.bg2=c.toDataURL('image/jpeg',.85);look();toast('✓')}catch{toast('Image too large')}};im.src=r.result};r.readAsDataURL(f)}}
function lmForm(tm){const f=$('#lm_f');if(tm=='none'&&lockMode=='none'){f.innerHTML='';return}
f.innerHTML=`${lockMode!='none'?`<input id="lo" type="password" placeholder="${t('old')}">`:''}${tm!='none'?`<input id="ln" type="password" placeholder="${t('neu')}"><input id="lc" type="password" placeholder="${t('confirm')}">`:`<div class="msg warn">${t('nolock_warn')}</div>`}<div class="msg" id="lm_s"></div><button class="primary" id="lm_g">${t('change')}</button>`;
$('#lm_g').onclick=async()=>{const e=$('#lm_s'),old=lockMode!='none'?norm($('#lo').value):'',nw=tm!='none'?norm($('#ln').value):'';
if(tm!='none'){if(nw.length<(tm=='pin'?4:6))return e.textContent=t('short');if(nw!=norm($('#lc').value))return e.textContent=t('mismatch')}
try{await inv('set_lock',{old,neu:nw,mode:tm});lockMode=tm;toast('✓');settingsView();bump()}catch(x){e.textContent=String(x)=='wrong'?t('wrong'):'Error: '+x}}}
/* pdf */
function mask(k){return k.length>8?k.slice(0,4)+'••••'+k.slice(-4):'••••'}
function exportPdf(){if(!items.length)return toast(t('empty'));const d=$('#m'),need=lockMode!='none';
d.innerHTML=`<h3>${t('exp')}</h3><label><input type="radio" name="em" value="mask" checked>${t('masked')}</label><label><input type="radio" name="em" value="full">${t('full')}</label><div id="ex_w" style="display:none"><label>${t('verify')}</label><input id="ex_p" type="password"></div><div class="msg" id="ex_m">${t('expnote')}</div><div class="row"><button id="ex_x">${t('cancel')}</button><button class="primary" id="ex_g">${ic('file',16)} ${t('exp')}</button></div>`;d.showModal();
const sel=()=>document.querySelector('[name=em]:checked').value;
document.querySelectorAll('[name=em]').forEach(r=>r.onchange=()=>$('#ex_w').style.display=(sel()=='full'&&need)?'block':'none');$('#ex_x').onclick=()=>d.close();
$('#ex_g').onclick=async()=>{const full=sel()=='full';if(full&&need){try{await inv('unlock',{secret:norm($('#ex_p').value)})}catch{$('#ex_m').textContent=t('wrong');return}}
const th=['#',t('name'),t('provider'),t('model'),'URL','API Key',t('notes')].map(x=>`<th>${x}</th>`).join('');
const rows=items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.name)}</td><td>${esc(i.provider)}</td><td dir="ltr">${esc(i.model)}</td><td dir="ltr">${esc(i.url)}</td><td dir="ltr">${esc(full?i.key:mask(i.key))}</td><td>${esc(i.notes)}</td></tr>`).join('');
$('#pa').innerHTML=`<h1>API Vault</h1><p>${new Date().toLocaleString(S.lang=='fa'?'fa-IR':'en-US')} — ${items.length}</p><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;d.close();setTimeout(()=>window.print(),200)}}
addEventListener('afterprint',()=>{const p=$('#pa');if(p)p.innerHTML=''});
/* init */
try{window.__TAURI__.event.listen('hidden',()=>{if(lockMode!='none'&&S.lockHide&&$('#mc'))doLock()})}catch{}
inv('set_tray',{on:S.tray}).catch(()=>{});
boot();
</script></body></html>
