[package]
name = "api-vault"
version = "1.0.0"
description = "Encrypted vault for AI API keys with a multi-model chat"
authors = ["Armin Barani"]
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/api-vault"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
